name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      run: |
        sudo apt-get -y install build-essential libgsl-dev \
        libopenblas-dev liblapacke liblapacke-dev \
        libcfitsio-dev libfftw3-dev pkg-config cmake
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: 3.14
    - name: Install NumPy
      run: pip install numpy fitsio
    - name: Test cmake build
      run: |
        mkdir myls-build-aux ; cd myls-build-aux
        cmake .. -DENABLE_MPI=OFF
        cmake --build . -j 2
        ctest .
    - name: Test Legacy configure
      run: |
        ./configure --build=github --enable-openmp
        make && make test
